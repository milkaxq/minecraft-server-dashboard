DataSource:
  backend: SQLITE
settings:
  sessions:
    enabled: false
  security:
    passwordHash: BCRYPT
    minPasswordLength: 10
    passwordMaxLength: 64
  logLevel: INFO
  serverName: Blockyard
  registration:
    enabled: true
    force: true
  restrictions:
    allowChat: false
    allowMovement: false
    ProtectInventoryBeforeLogIn: true
    maxRegPerIp: 5
  enablePremium: true
Security:
  SQLProblem:
    stopServer: true
Hooks:
  bungeecord: false
